[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-arc"
version = "0.1.0"
description = "Provider-neutral architecture-to-code agent foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
gemini = ["google-genai>=2.24,<3"]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
