<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Fractions</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Space Fractions</h1>
    <nav>
      <button id="menuBtn" class="linklike" aria-controls="mainMenu">Main Menu</button>
      <button id="helpBtn" class="linklike" aria-controls="helpSection">Help</button>
      <span id="userStatus" aria-live="polite"></span>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <section id="intro" class="scene" aria-label="Intro Movie">
      <canvas id="introCanvas" width="600" height="240" role="img" aria-label="Animated spaceship with title Space Fractions"></canvas>
      <div class="controls">
        <button id="skipIntroBtn">Skip Intro</button>
        <button id="startBtn">Start</button>
      </div>
    </section>

    <section id="mainMenu" class="scene hidden" aria-label="Main Menu">
      <h2>Main Menu</h2>
      <div class="panel">
        <button id="playBtn">Play Game</button>
        <button id="viewScoreBtn">View Score</button>
        <button id="viewHelpBtn">View Help</button>
        <div class="login">
          <label>Username: <input id="usernameInput" /></label>
          <button id="loginBtn">Login</button>
        </div>
      </div>
    </section>

    <section id="game" class="scene hidden" aria-label="Game">
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Question <strong id="qnum">1</strong>/<span id="qtotal">5</span></span>
        <span>State: <strong id="state">Playing</strong></span>
        <button id="pauseBtn">Pause (P)</button>
        <button id="resumeBtn" class="hidden">Resume (P)</button>
      </div>
      <div id="prompt" class="prompt" aria-live="polite">Loading...</div>
      <ul id="options" class="options" role="listbox" aria-label="Answer options"></ul>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <section id="scoreScene" class="scene hidden" aria-label="Score">
      <h2>Your Score</h2>
      <p id="scoreText">No game played yet.</p>
      <button id="playAgainBtn">Play Again</button>
    </section>

    <section id="helpSection" class="scene hidden" aria-label="Help">
      <h2>Help</h2>
      <div id="helpContent">Loading...</div>
    </section>

    <section id="admin" class="scene hidden" aria-label="Admin">
      <h2>Admin: Update Questions</h2>
      <p>Paste JSON array of questions with fields: id, prompt, options, answerIndex</p>
      <textarea id="questionsJson" rows="8" cols="50" aria-label="Questions JSON"></textarea>
      <div>
        <button id="submitQuestionsBtn">Submit Questions</button>
        <span id="adminStatus" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <footer>
    <small>&copy; 2026 Space Fractions</small>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
